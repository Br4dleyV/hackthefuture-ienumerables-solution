tabLedger=Ilse’s ledger
ledgerGuide=Every suspicious line, with the reason in plain words. Suspicious is not proven: the council hears what changed and when, never who.
ledgerStarted=Started: {0} (record time)
ledgerOddCount={0} odd changes
ledgerOneNight=All in one night
ledgerManyNights=Bit by bit over {0} nights, last on {1}
ledgerRulesTitle=How we decide
ledgerRuleTime=Times are as the records keep them: UTC (the "Z" after each time). Nobody could tell us if the village clock is the same, so a change close to four o'clock could be an hour off.
ledgerRuleNight=Night: changed between midnight and four, when nobody works. Not later, because Tobin starts at four.
ledgerRuleName=No name or "system": nobody in the village signed the change.
ledgerRuleImpossible=Impossible: a sensor showing more than double what its pipe can carry, or stock below zero.
ledgerRuleClash=Clash: a sensor and its pipe record more than 20% apart. That line is our choice, because nobody knows how far they normally wobble. When they clash, both lines are marked.
ledgerRulePattern=Fits a pattern: a wrong number, and other lines changed the same odd way on the same night. Still suspicious, not proven.
ledgerClash=Clashes with its own sensor — trust neither line until Maren has checked.
