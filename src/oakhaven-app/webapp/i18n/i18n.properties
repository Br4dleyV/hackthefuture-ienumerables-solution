ledgerCapacity=Sensor reading is more than double what the pipe can carry, so it cannot be true.
ledgerMismatch=The sensor and pipe flows disagree by more than 20% of the larger reading.
ledgerNegative=Stock quantity is negative. Verify the count before ordering.
ledgerAuditOnly=Changed at an odd time or without a name, but the number itself looks normal.
